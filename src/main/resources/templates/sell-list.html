<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/sell-list.css}">
<title>売りたいリスト</title>
</head>
<body>


	<header class="sell-header">
		<h1>Sell List</h1>
		<p>売りたいリスト</p>
		<a th:href="@{/cloth}" class="back-link">← 一覧へ戻る</a>
	</header>

	<main class="sell-page">

		<section class="summary-card">
			<div class="section-title">
				<p class="section-subtitle">Summary</p>
				<h2>売却予定まとめ</h2>
			</div>

			<div class="summary-grid">
				<div class="summary-item">
					<span>合計定価</span>
					<strong>¥<span th:text="${totalPrice}">0</span></strong>
				</div>

				<div class="summary-item" th:if="${topsCount > 0}">
					<span>売りたい服</span>
					<strong><span th:text="${topsCount}">0</span>着</strong>
				</div>

				<div class="summary-item" th:if="${shoesCount > 0}">
					<span>売りたいシューズ</span>
					<strong><span th:text="${shoesCount}">0</span>足</strong>
				</div>

				<div class="summary-item" th:if="${bagCount > 0}">
					<span>売りたいバッグ</span>
					<strong><span th:text="${bagCount}">0</span>個</strong>
				</div>
			</div>
		</section>

		<section class="sell-section">
			<div class="section-title">
				<p class="section-subtitle">Items</p>
				<h2>登録中のお洋服</h2>
			</div>

			<div class="empty-card" th:if="${#lists.isEmpty(sellClothes)}">
				<p>売りたいリストに登録されているお洋服はありません。</p>
			</div>

			<div class="sell-grid" th:unless="${#lists.isEmpty(sellClothes)}">
				<div class="sell-card" th:each="cloth : ${sellClothes}">

					<a th:href="@{/cloth/detail/{id}(id=${cloth.id})}">
						<img th:src="@{/uploads/{img}(img=${cloth.imageName})}" alt="服の画像">
					</a>

					<div class="sell-info">
						<h3 th:text="${cloth.name}">商品名</h3>

						<p>
							<span>Brand</span>
							<strong th:text="${cloth.brand}">ブランド</strong>
						</p>

						<p>
							<span>Price</span>
							<strong>¥<span th:text="${cloth.price}">0</span></strong>
						</p>

						<form th:action="@{/cloth/sell-list/unsell/{id}(id=${cloth.id})}"
							  method="post">
							<button type="submit">❌ リスト解除</button>
						</form>
					</div>

				</div>
			</div>
		</section>

	</main>

	</body>
