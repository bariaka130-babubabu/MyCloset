<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>売りたいリスト</title>
</head>
<body>

	<h1>💰 売りたいリスト</h1>

	<a th:href="@{/cloth}">
	    一覧へ戻る
	</a>
	
	<h2>📊 売却予定まとめ</h2>

	<p>
	    💰 合計定価：
	    ¥<span th:text="${totalPrice}"></span>
	</p>
	
	<p th:if="${topsCount > 0}">
	    👚 売りたい服：
	    <span th:text="${topsCount}"></span>着
	</p>

	<p th:if="${shoesCount > 0}">
	    👟 売りたいシューズ：
	    <span th:text="${shoesCount}"></span>足
	</p>

	<p th:if="${bagCount > 0}">
	    👜 売りたいバッグ：
	    <span th:text="${bagCount}"></span>個
	</p>

	<hr>

	<div th:each="cloth : ${sellClothes}">

	    <img
	        th:src="@{/uploads/{img}(img=${cloth.imageName})}"
	        style="max-width:200px;"
	    >

		<p>
		    <strong>商品名：</strong>
		    <span th:text="${cloth.name}"></span>
		</p>

		<p>
		    <strong>ブランド：</strong>
		    <span th:text="${cloth.brand}"></span>
		</p>

		<p>
		    <strong>定価：</strong>
		    ¥<span th:text="${cloth.price}"></span>
		</p>
		
		<form th:action="@{/cloth/sell-list/unsell/{id}(id=${cloth.id})}"
		      method="post">

		    <button type="submit">
		        ❌ 売りたいリスト解除
		    </button>

		</form>

	    <hr>

	</div>
</body>
</html>
