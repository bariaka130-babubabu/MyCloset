<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/detail.css}">
<title>服の詳細ページ</title>
</head>
<body>

	<div class="detail-page">

		<a th:href="@{/cloth}" class="back-link">← 一覧へ戻る</a>

		<section class="detail-card">

			<div class="image-area">
				<img th:src="@{/uploads/{img}(img=${cloth.imageName})}" alt="お洋服画像">
			</div>

			<div class="info-area">

				<p class="page-subtitle">Item Detail</p>
				<h1 th:text="${cloth.name}">お洋服名</h1>

				<div class="price">
					¥<span th:text="${cloth.price}">0</span>
				</div>

				<div class="info-list">
					<p>🏷️ <span>ブランド</span><strong th:text="${cloth.brand}"></strong></p>
					<p>🤎 <span>カラー</span><strong th:text="${cloth.color}"></strong></p>
				</div>

				<div class="season-box">
					<h3>Wearing Season</h3>
					<div class="season-tags">
						<span th:if="${cloth.spring}">🌸 春</span>
						<span th:if="${cloth.summer}">☀️ 夏</span>
						<span th:if="${cloth.autumn}">🍁 秋</span>
						<span th:if="${cloth.winter}">❄️ 冬</span>
					</div>
				</div>

				<p class="status-text" th:if="${cloth.favorite}">
					⭐ お気に入り登録済み
				</p>

				<p class="status-text" th:if="${cloth.sell}">
					✅ 売りたいリストに登録済み
				</p>

				<div class="button-area">

					<form th:if="${cloth.favorite}"
						  th:action="@{/cloth/unfavorite/{id}(id=${cloth.id})}"
						  method="post">
						<button type="submit" class="sub-btn">💔 お気に入り解除</button>
					</form>

					<form th:unless="${cloth.favorite}"
						  th:action="@{/cloth/favorite/{id}(id=${cloth.id})}"
						  method="post">
						<button type="submit" class="main-btn">❤️ お気に入り登録</button>
					</form>

					<form th:if="${!cloth.sell}"
						  th:action="@{/cloth/sell/{id}(id=${cloth.id})}"
						  method="post">
						<button type="submit" class="main-btn">💰 売りたいリストに追加</button>
					</form>

					<form th:if="${cloth.sell}"
						  th:action="@{/cloth/unsell/{id}(id=${cloth.id})}"
						  method="post">
						<button type="submit" class="sub-btn">❌ 売りたいリストから外す</button>
					</form>

					<a href="#" class="edit-link">✏️ 編集</a>

					<form th:action="@{/delete/{id}(id=${cloth.id})}"
						  method="post"
						  onsubmit="return confirm('本当に削除しますか？')">
						<button type="submit" class="delete-btn">🗑️ この服を削除する</button>
					</form>

				</div>

			</div>

		</section>

	</div>

</body>
</html>
