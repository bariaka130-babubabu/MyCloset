<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>検索結果一覧</title>
</head>
<body>
	<header>
		<h1>MyCloset - 検索結果</h1>
<!--	nav =(ナビゲーション：ページ移動の案内所）-->
		<nav>
		<a th:href="@{/cloth}" class="back-btn">クローゼット一覧に戻る</a>			</a>
		</nav>
	</header>

	<div>
		<h2>見つかったお洋服</h2>
<!--th:if="..."：条件が正しい(true)=この<div>全体を表示する-->
<!--${#lists.isEmpty(clothes)}：clothes(服のリストデータ)が空(empty)かどうかをチェック-->
<!--	#lists=Thymeleafが最初から用意してくれている(ユーティリティオブジェクト)-->
<!--　　${}=model.addAttribute("clothes", ...)のclothes表示のため-->
		<div th:if="${#lists.isEmpty(clothes)}">
			<p>指定されたカテゴリのお洋服はまだ登録されていません。</p>
		</div>
<!-- th:unless="..."：th:ifの真逆で、条件が「成り立たない(false)」時表示-->
<!--もし服のリストが空っぽではない（＝データが1件以上ある）なら、以下の処理をする」-->
		<div th:unless="${#lists.isEmpty(clothes)}">
<!--	th:each="個別名 : ${リスト名}"：javaでいうfor文（繰り返し処理-->
			<div th:each="cloth : ${clothes}" style="margin-bottom: 30px;">
<!--	ブラウザ（ChromeやSafariなど）に対して、「この画像が欲しければ、
		このURL（住所）にアクセスして画像をとってきてね」と指示を出している-->
			<img th:src="@{/uploads/{aaa}(aaa=${cloth.imageName})}" alt="服の画像" 
			style="max-width: 200px;" />
				
<!--	服の情報を表示する段落の開始です。-->
		<h3>
       		👗 <span th:text="${cloth.name}"></span>
   		</h3>
		<p>
		      🎨 カラー：
		      <span th:text="${cloth.color}"></span>
		  </p>

		  <p>
		      🏷️ ブランド：
		      <span th:text="${cloth.brand}"></span>
		  </p>

		  <p>
		      👚 カテゴリ：

		      <span th:if="${cloth.category == 'tops'}">トップス👚</span>
		      <span th:if="${cloth.category == 'pants'}">パンツ👖</span>
		      <span th:if="${cloth.category == 'skirt'}">スカート👧</span>
		      <span th:if="${cloth.category == 'onepiece'}">ワンピース👗</span>
		      <span th:if="${cloth.category == 'outer'}">アウター🧥</span>
		      <span th:if="${cloth.category == 'shoes'}">シューズ👟</span>
		      <span th:if="${cloth.category == 'bag'}">バッグ👜</span>

		  </p>
		  <p>
		      🌸季節：

		      <span th:if="${cloth.spring}">春🌸 </span>
		      <span th:if="${cloth.summer}">夏☀️ </span>
		      <span th:if="${cloth.autumn}">秋🍁 </span>
		      <span th:if="${cloth.winter}">冬❄️ </span>
		  </p>
		  <p>
		      💰 価格：
		      ¥<span th:text="${cloth.price}"></span>
		  </p>

		  <p>
		      ❤️ お気に入り：
		      <span th:text="${cloth.favorite ? '登録済み' : '未登録'}"></span>
		  </p>
		  <form
		      th:if="${cloth.favorite}"
		      th:action="@{/cloth/unfavorite/{id}(id=${cloth.id})}"
		      method="post">

		      <button type="submit">
		          💔 お気に入り解除
		      </button>

		  </form>

		  <form
		      th:unless="${cloth.favorite}"
		      th:action="@{/cloth/favorite/{id}(id=${cloth.id})}"
		      method="post">

		      <button type="submit">
		          ❤️ お気に入り登録
		      </button>

		  </form>		  
		  <form
		      th:if="${cloth.sell}"
		      th:action="@{/cloth/unsell/{id}(id=${cloth.id})}"
		      method="post">

		      <button type="submit">
		          ❌ 売りたいリスト解除
		      </button>

		  </form>

		  <form
		      th:unless="${cloth.sell}"
		      th:action="@{/cloth/sell/{id}(id=${cloth.id})}"
		      method="post">

		      <button type="submit">
		          💰 売りたいリスト追加
		      </button>

		  </form>
		  
		  <form th:action="@{/delete/{id}(id=${cloth.id})}"
		        method="post"
		        onsubmit="return confirm('本当に削除しますか？')">

		      <button type="submit">
		          🗑️ 削除
		      </button>

		  </form>
<!--		  テスト-->
		<p th:text="${cloth.spring}"></p>
		<p th:text="${cloth.favorite}"></p>

<!-- hr/：服と服の間に区切り線（横線）を引いています。-->
			<hr/>	
				
		</div>
		
		
		
		</div>
	
	
	
	
</body>
</html>
